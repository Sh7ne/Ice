name: Build macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-26
    environment: release
    timeout-minutes: 180
    env:
      APPLE_TEAM_ID: AMHB5QVH4B
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DERIVED_DATA_PATH: ${{ runner.temp }}/IceDerivedData
      SOURCE_PACKAGES_PATH: ${{ runner.temp }}/IceSourcePackages
      APP_PATH: ${{ runner.temp }}/IceDerivedData/Build/Products/Release/Ice.app
      DIST_DIR: ${{ runner.temp }}/IceDistribution

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Validate tag and release secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
              echo "Release tag must start with v followed by a version number" >&2
              exit 1
          fi

          missing=()
          [[ -n "$CERTIFICATE_BASE64" ]] || missing+=(DEVELOPER_ID_APPLICATION_P12_BASE64)
          [[ -n "$CERTIFICATE_PASSWORD" ]] || missing+=(DEVELOPER_ID_APPLICATION_P12_PASSWORD)
          [[ -n "$NOTARY_KEY_ID" ]] || missing+=(APP_STORE_CONNECT_KEY_ID)
          [[ -n "$NOTARY_ISSUER_ID" ]] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
          [[ -n "$NOTARY_KEY_BASE64" ]] || missing+=(APP_STORE_CONNECT_PRIVATE_KEY_BASE64)

          if (( ${#missing[@]} > 0 )); then
              printf 'Missing release secret: %s\n' "${missing[@]}" >&2
              exit 1
          fi

          xcodebuild -version

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/DeveloperIDApplication.p12"
          keychain_path="$RUNNER_TEMP/IceRelease.keychain-db"
          notary_key_path="$RUNNER_TEMP/AuthKey.p8"
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$certificate_path" "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
              -k "$keychain_path" \
              -P "$CERTIFICATE_PASSWORD" \
              -A \
              -t cert \
              -f pkcs12
          security set-key-partition-list \
              -S apple-tool:,apple: \
              -s \
              -k "$keychain_password" \
              "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          signing_identity="$(
              security find-identity -v -p codesigning "$keychain_path" |
                  awk '/"Developer ID Application:/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
              echo "The imported archive has no valid Developer ID Application identity" >&2
              exit 1
          fi

          echo "ICE_CODE_SIGN_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "RELEASE_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"

      - name: Build and test Release app
        run: |
          set -euo pipefail

          ICE_DISTRIBUTION_BUILD=1 \
          ICE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          CONFIGURATION=Release \
          DERIVED_DATA_PATH="$DERIVED_DATA_PATH" \
          SOURCE_PACKAGES_PATH="$SOURCE_PACKAGES_PATH" \
          ./Scripts/smoke-test-xpc.sh

          app_version="$(
              /usr/libexec/PlistBuddy \
                  -c 'Print :CFBundleShortVersionString' \
                  "$APP_PATH/Contents/Info.plist"
          )"
          if [[ "$RELEASE_TAG" != "v$app_version" ]]; then
              echo "Tag $RELEASE_TAG does not match app version v$app_version" >&2
              exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Notarize and package
        env:
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          notarization_zip="$RUNNER_TEMP/Ice-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$notarization_zip"

          xcrun notarytool submit "$notarization_zip" \
              --key "$NOTARY_KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait \
              --timeout 150m

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

          release_directory="$DIST_DIR/Ice"
          mkdir -p "$release_directory"
          ditto "$APP_PATH" "$release_directory/Ice.app"
          codesign --verify --deep --strict --verbose=2 "$release_directory/Ice.app"
          xcrun stapler validate "$release_directory/Ice.app"
          cp "$GITHUB_WORKSPACE/LICENSE" "$release_directory/LICENSE"
          printf 'Corresponding source: https://github.com/%s/tree/%s\n' \
              "$GITHUB_REPOSITORY" \
              "$RELEASE_TAG" \
              > "$release_directory/SOURCE.txt"
          ditto -c -k \
              --sequesterRsrc \
              --keepParent \
              "$release_directory" \
              "$DIST_DIR/Ice.zip"
          (
              cd "$DIST_DIR"
              shasum -a 256 Ice.zip > Ice.zip.sha256
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Ice-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.DIST_DIR }}/Ice.zip
            ${{ env.DIST_DIR }}/Ice.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
              "$DIST_DIR/Ice.zip#Ice for Apple silicon" \
              "$DIST_DIR/Ice.zip.sha256#SHA-256 checksum" \
              --verify-tag \
              --generate-notes \
              --title "Ice $RELEASE_TAG"

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" ]]; then
              security delete-keychain "$RELEASE_KEYCHAIN_PATH" || true
          fi
          rm -f \
              "${RELEASE_CERTIFICATE_PATH:-}" \
              "${NOTARY_KEY_PATH:-}"
